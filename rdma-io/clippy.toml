disallowed-methods = [
    { path = "std::thread::spawn", reason = "v2 progress must be driven by an application-owned future" },
    { path = "std::thread::scope", reason = "v2 progress must not create scoped worker threads" },
    { path = "std::thread::Builder::spawn", reason = "v2 progress must be driven by an application-owned future" },
    { path = "std::thread::Builder::spawn_scoped", reason = "v2 progress must not create scoped worker threads" },
    { path = "tokio::task::spawn", reason = "return the v2 driver to the application instead" },
    { path = "tokio::task::spawn_blocking", reason = "v2 must not hide blocking work behind a runtime task" },
    { path = "tokio::task::spawn_local", reason = "return the v2 driver to the application instead" },
    { path = "tokio::runtime::Handle::spawn", reason = "return the v2 driver to the application instead" },
    { path = "tokio::runtime::Handle::spawn_blocking", reason = "v2 must not hide blocking work behind a runtime task" },
    { path = "tokio::task::LocalSet::spawn_local", reason = "return the v2 driver to the application instead" },
    { path = "tokio::task::JoinSet::spawn", reason = "return the v2 driver to the application instead" },
    { path = "tokio::task::JoinSet::spawn_on", reason = "return the v2 driver to the application instead" },
    { path = "tokio::task::JoinSet::spawn_local", reason = "return the v2 driver to the application instead" },
    { path = "tokio::task::JoinSet::spawn_local_on", reason = "return the v2 driver to the application instead" },
    { path = "tokio::task::JoinSet::spawn_blocking", reason = "v2 must not hide blocking work behind a runtime task" },
    { path = "tokio::task::JoinSet::spawn_blocking_on", reason = "v2 must not hide blocking work behind a runtime task" },
    { path = "futures_util::task::SpawnExt::spawn", reason = "return the v2 driver to the application instead" },
    { path = "futures_util::task::LocalSpawnExt::spawn_local", reason = "return the v2 driver to the application instead" },
    { path = "libc::pthread_create", reason = "v2 must not create native worker threads" },
]

disallowed-types = [
    { path = "std::thread::Builder", reason = "v2 must not construct worker threads" },
    { path = "tokio::runtime::Runtime", reason = "v2 uses the application's runtime" },
    { path = "tokio::runtime::Builder", reason = "v2 uses the application's runtime" },
    { path = "tokio::task::LocalSet", reason = "v2 returns explicit progress futures instead of owning an executor" },
    { path = "tokio::task::JoinSet", reason = "v2 returns explicit progress futures instead of owning tasks" },
]
